<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор стоимости услуг</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 18px;
            max-width: 850px;
            margin: 35px auto;
            padding: 0 24px;
            line-height: 1.5;
            color: #222;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
        }

        h2 {
            font-size: 24px;
            margin-top: 30px;
        }

        fieldset {
            margin-bottom: 22px;
            padding: 16px;
            border: 1px solid #999;
            border-radius: 6px;
        }

        legend {
            padding: 0 8px;
            font-weight: bold;
        }

        .service-choice {
            display: block;
            margin: 10px 0;
            cursor: pointer;
        }

        label[for="quantity"],
        label[for="option"] {
            display: block;
            margin-bottom: 8px;
        }

        input[type="text"],
        select {
            box-sizing: border-box;
            width: 100%;
            max-width: 420px;
            min-height: 48px;
            padding: 10px;
            font-size: 18px;
            border: 1px solid #777;
            border-radius: 4px;
            background-color: white;
        }

        .form-section {
            margin-bottom: 22px;
        }

        .property-choice {
            display: block;
            margin: 18px 0;
        }

        button {
            padding: 13px 22px;
            font-size: 18px;
            border: none;
            border-radius: 4px;
            background-color: #111;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #333;
        }

        input:focus,
        select:focus,
        button:focus {
            outline: 2px solid #555;
            outline-offset: 2px;
        }

        #error-message {
            color: #c62828;
            font-weight: bold;
        }

        #result {
            padding: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #f5f5f5;
            font-size: 24px;
            font-weight: bold;
        }

        .price-info {
            color: #555;
            font-size: 15px;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 600px) {
            body {
                margin: 20px auto;
                padding: 0 16px;
                font-size: 17px;
            }

            h1 {
                font-size: 27px;
            }

            input[type="text"],
            select {
                max-width: 100%;
            }

            button {
                width: 100%;
                min-height: 52px;
            }

            #result {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <h1>Калькулятор стоимости услуг</h1>

    <form id="calculator-form" novalidate>

        <!-- Выбор типа услуги -->
        <fieldset>
            <legend>Выберите тип услуги</legend>

            <label class="service-choice">
                <input
                    type="radio"
                    name="serviceType"
                    value="consultation"
                    checked>
                Консультация — 1 000 руб. за единицу
            </label>

            <label class="service-choice">
                <input
                    type="radio"
                    name="serviceType"
                    value="repair">
                Ремонт компьютера — 2 500 руб. за единицу
            </label>

            <label class="service-choice">
                <input
                    type="radio"
                    name="serviceType"
                    value="delivery">
                Доставка — 500 руб. за единицу
            </label>
        </fieldset>

        <!-- Количество -->
        <div class="form-section">
            <label for="quantity">Количество услуг:</label>

            <input
                type="text"
                id="quantity"
                name="quantity"
                inputmode="numeric"
                autocomplete="off"
                placeholder="Введите количество"
                value="1"
                required
                aria-describedby="error-message">

            <p class="price-info">
                Введите целое положительное число.
            </p>
        </div>

        <!-- Опции второго типа услуги -->
        <div id="options-container" class="form-section" hidden>
            <label for="option">Выберите вариант ремонта:</label>

            <select id="option" name="option">
                <option value="0">Базовый ремонт — без доплаты</option>
                <option value="800">Расширенный ремонт — +800 руб.</option>
                <option value="1500">Премиум-ремонт — +1 500 руб.</option>
            </select>
        </div>

        <!-- Свойство третьего типа услуги -->
        <div id="property-container" class="form-section" hidden>
            <label class="property-choice">
                <input
                    type="checkbox"
                    id="property"
                    name="property">
                Срочная доставка (+700 руб. за услугу)
            </label>
        </div>

        <!-- Ошибка ввода -->
        <p id="error-message" role="alert" hidden></p>

        <!-- Кнопка оставлена для расчёта по требованию задания -->
        <button type="submit">Рассчитать стоимость</button>

    </form>

    <!-- Результат -->
    <section aria-live="polite">
        <h2>Стоимость заказа</h2>

        <p id="result">
            Стоимость: 1 000 руб.
        </p>
    </section>

    <script>
      
"use strict";

document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("calculator-form");
    const quantityInput = document.getElementById("quantity");
    const serviceTypes = document.querySelectorAll(
        'input[name="serviceType"]'
    );

    const optionsContainer = document.getElementById("options-container");
    const optionSelect = document.getElementById("option");

    const propertyContainer = document.getElementById("property-container");
    const propertyCheckbox = document.getElementById("property");

    const errorMessage = document.getElementById("error-message");
    const result = document.getElementById("result");

    const quantityPattern = /^[0-9]+$/;
    let resultVisible = false;

    const services = {
        consultation: {
            name: "Консультация",
            price: 1000
        },
        repair: {
            name: "Ремонт компьютера",
            price: 2500
        },
        delivery: {
            name: "Доставка",
            price: 500
        }
    };

    function getSelectedServiceType() {
        const selected = document.querySelector(
            'input[name="serviceType"]:checked'
        );

        return selected ? selected.value : "";
    }

    function formatPrice(price) {
        return price.toLocaleString("ru-RU") + " руб.";
    }

    function clearError() {
        errorMessage.textContent = "";
        errorMessage.hidden = true;
    }

    function hideResult() {
        resultVisible = false;
        result.textContent =
            "Выберите параметры услуги и нажмите кнопку расчёта.";
        result.hidden = true;
    }

    function showError(message) {
        errorMessage.textContent = message;
        errorMessage.hidden = false;
        result.hidden = true;
        resultVisible = false;
    }

    function updateServiceFields() {
        const serviceType = getSelectedServiceType();

        optionsContainer.hidden = true;
        propertyContainer.hidden = true;

        optionSelect.value = "0";
        propertyCheckbox.checked = false;

        if (serviceType === "repair") {
            optionsContainer.hidden = false;
        } else if (serviceType === "delivery") {
            propertyContainer.hidden = false;
        }

        clearError();
        hideResult();
    }

    function calculateCost() {
        clearError();

        const serviceType = getSelectedServiceType();
        const quantityValue = quantityInput.value.trim();

        if (quantityValue === "") {
            showError("Введите количество услуг.");
            quantityInput.focus();
            return;
        }

        if (!quantityPattern.test(quantityValue)) {
            showError(
                "Ошибка: количество должно содержать только цифры."
            );
            quantityInput.focus();
            return;
        }

        const quantity = Number(quantityValue);

        if (!Number.isSafeInteger(quantity) || quantity <= 0) {
            showError(
                "Количество должно быть целым числом больше нуля."
            );
            quantityInput.focus();
            return;
        }

        if (!Object.prototype.hasOwnProperty.call(
            services,
            serviceType
        )) {
            showError("Выберите тип услуги.");
            return;
        }

        const service = services[serviceType];
        let unitPrice = service.price;
        let details = service.name;

        if (serviceType === "repair") {
            const optionPrice = Number(optionSelect.value);

            if (!Number.isFinite(optionPrice) || optionPrice < 0) {
                showError("Выберите корректную опцию ремонта.");
                optionSelect.focus();
                return;
            }

            unitPrice += optionPrice;

            const selectedOption =
                optionSelect.options[optionSelect.selectedIndex];

            details += " — " + selectedOption.textContent;
        }

        if (
            serviceType === "delivery" &&
            propertyCheckbox.checked
        ) {
            unitPrice += 700;
            details += " (срочная)";
        }

        const total = unitPrice * quantity;

        if (!Number.isSafeInteger(total)) {
            showError("Слишком большое количество услуг.");
            quantityInput.focus();
            return;
        }

        result.textContent =
            "Стоимость заказа: " + formatPrice(total);

        result.title =
            details +
            "; количество: " + quantity +
            "; цена за единицу: " + formatPrice(unitPrice);

        result.hidden = false;
        resultVisible = true;
    }

    serviceTypes.forEach(function (radio) {
        radio.addEventListener("change", updateServiceFields);
    });

    quantityInput.addEventListener("input", function () {
        clearError();
        hideResult();
    });

    optionSelect.addEventListener("change", function () {
        clearError();
        hideResult();
    });

    propertyCheckbox.addEventListener("change", function () {
        clearError();
        hideResult();
    });

    form.addEventListener("submit", function (event) {
        event.preventDefault();
        calculateCost();
    });

    updateServiceFields();
});

    </script>

</body>
</html>
